name: OpenTofu Tests

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  tofu-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        # >= 1.13 is required for the convert() function used by the rotation engine
        tofu_version: "~1.13.0"

    - name: OpenTofu Format Check
      run: tofu fmt -check -recursive

    - name: Initialize OpenTofu
      run: tofu init

    - name: Run Test Case A - Duplicate Credentials (Should Fail)
      run: |
        echo "Setting up Test Case A - Creating duplicate configuration"
        # Create duplicate configuration to trigger conflict
        cp configurations/test_service/rotation/dynamic-cred.yml configurations/test_service/rotation/static-cred.yml

        echo "Running duplicate credentials test"
        tofu test -filter=tests/duplicate_credentials.tftest.hcl

        echo "Cleaning up duplicate configuration"
        rm -f configurations/test_service/rotation/static-cred.yml

    - name: Run Test Case B - Standard Rotation (Should Pass)
      run: |
        echo "Running Test Case B - Standard rotation test"
        tofu test -filter=tests/standard_rotation.tftest.hcl
        # No cloud credentials are available in CI, so this also proves that the providers of
        # unused extensions are never configured.

    - name: Run Extension Unit Tests (Mock Providers)
      run: |
        filters=""
        for f in tests/ext_*.tftest.hcl; do filters="$filters -filter=$f"; done
        tofu test $filters

    - name: Validate Example Configurations
      run: |
        # Activate all examples and validate the engine wiring with them (no provider calls).
        cp -r examples/configurations/* configurations/
        tofu validate
        git checkout -- configurations && git clean -fdq configurations

    - name: Cleanup Test Resources
      if: always()
      run: |
        echo "Cleaning up any remaining test resources"
        # Destroy any remaining test infrastructure
        tofu destroy -auto-approve || true
        # Clean up any duplicate config files that might remain
        rm -f configurations/test_service/rotation/static-cred.yml
